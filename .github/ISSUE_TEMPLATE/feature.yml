name: Feature
description: Propose a new capability or a change in product behavior.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Describe the problem and the proposed change. Write in English.
  - type: dropdown
    id: package
    attributes:
      label: Affected package
      multiple: true
      options:
        - frontend
        - backend
        - extension
        - docs
        - repository root
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist of conditions that must be true for this feature to be done.
      placeholder: |
        - [ ] ...
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: i18n
    attributes:
      label: i18n impact
      description: Product UI copy should be planned for en, ja, and ko.
      options:
        - "No user-facing strings"
        - "Needs en / ja / ko copy"
        - "Unknown"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
    validations:
      required: false
