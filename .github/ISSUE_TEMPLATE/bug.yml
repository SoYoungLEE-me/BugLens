name: Bug
description: Report unexpected behavior or a defect.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Describe the defect so it can be reproduced. Write in English.
  - type: dropdown
    id: package
    attributes:
      label: Affected package
      multiple: true
      options:
        - frontend
        - backend
        - extension
        - docs
        - repository root
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps that trigger the bug.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Node/Ruby versions, or other relevant context.
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Remove secrets, tokens, and personal data first. Then attach redacted logs or screenshots.
    validations:
      required: false
