name: Task
description: Setup, refactoring, documentation, or other general development work.
title: "[Task]: "
body:
  - type: markdown
    attributes:
      value: Use this form for work that is not a bug or a product feature. Write in English.
  - type: dropdown
    id: type
    attributes:
      label: Task type
      options:
        - Environment / setup
        - Refactoring
        - Documentation
        - Chore
        - Other
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Affected package
      multiple: true
      options:
        - frontend
        - backend
        - extension
        - docs
        - repository root
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this task is done?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist or conditions for done.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Notes
    validations:
      required: false
